# GoalPost GraphQL Schema - Unified Schema (Main + Reference Merged)
# Designed for pulse-first, context-aware relational data modeling.
#
# Architecture:
# - Pulses are the write path (first-class citizens)
# - Resonance is the read/insight path (AI-generated meaning)
# - Spaces define privacy boundaries (MeSpace/WeSpace)
# - AI adds meaning after the fact (explainability layer)
#
# Migration Notes:
# - Legacy Goals → GoalPulse (in FieldContext within MeSpace/WeSpace)
# - Legacy Resources → ResourcePulse (in FieldContext within MeSpace/WeSpace)
# - Legacy CoreValues → CoreValuePulse (GOAL-287; migrated nodes also keep :CoreValue for provenance)
# - Legacy CarePoints → PromiseWeave connector nodes (GOAL-266); StoryPulse still declares their optional fields for any un-migrated rows
# - Legacy Communities → WeSpaces (properties merged into Space interface)
# - Direct relationships → ResonanceLinks (AI-discovered patterns within FieldContext)
#
# PULSE ACCESS PATTERN:
# - Pulses are ONLY shown in FieldContexts
# - User pulses → FieldContext in auto-created MeSpace ("{User's name} MeSpace")
# - Community pulses → FieldContext in WeSpace ("{Community name} Field")
# - Pulse-to-pulse relationships → ResonanceLinks within the same FieldContext
#
# MIGRATION EXAMPLE:
# Person "Alice" with Goal "Launch App" → 
#   1. Create MeSpace "Alice MeSpace"
#   2. Create FieldContext "Alice's Goals" in MeSpace
#   3. Create GoalPulse "Launch App" in FieldContext
#   4. Related pulses get ResonanceLinks in same context

extend schema @authentication

# ============================================================================
# ENUMS
# ============================================================================

enum Status {
  ACTIVE
  INACTIVE
  PENDING
}

enum GoalStatus {
  ACTIVE
  PAUSED
  COMPLETED
}

enum GoalHorizon {
  SHORT
  MID
  LONG
}

enum SpaceRole {
  ADMIN
  MEMBER
  GUEST
}

enum SpaceVisibility {
  PRIVATE
  SHARED
}

# ============================================================================
# RELATIONSHIP PROPERTIES
# ============================================================================

"""
Properties for person-to-person connections.
Now represented via ResonanceLinks with these metadata properties.
"""
type ConnectedTo @relationshipProperties {
  why: String
  interests: String
}

"""
Flat edge type used to expose CONNECTED_TO relationship properties alongside the connected person ID.
Returned by Person.connectionEdges via Cypher to avoid nesting issues with @cypher + @relationship.
"""
type PersonConnectionEdge {
  connectedPersonId: String!
  why: String
  interests: String
}



# ============================================================================
# CORE ACTORS (Who initiates pulses & owns spaces)
# ============================================================================

"""
Base interface for Person entities.
Defines common properties across Person and User types.

This interface carries ONLY the open directory identity. `phone` / `email` /
`pronouns` / `location` used to be declared here too; they moved to
`PersonPrivateProfile` behind the single GOAL-275 gate, and a GraphQL type must
expose every field its interface declares — so leaving them here would have
forced `Person` to keep exposing them.

`@query(read: false, aggregate: false)`: the interface's auto-generated roots
(`personInterfaces`, `personInterfacesAggregate`, `personInterfacesConnection`)
read the same `:Person` nodes as a parallel path that inherits no
authorization. Even now that the interface itself is PII-free, those roots
would still hand out an ungated enumeration of every Person, so the lock stays.
The app never queries them — all Person access goes through `people` /
`relatedPeople`. Mirrors the `User` type lock.

Add new gated fields to `PersonPrivateProfile`, never here and never to
`Person` — see that type's docstring for why.
"""
interface PersonInterface @query(read: false, aggregate: false) {
  id: ID!
  firstName: String!
  lastName: String!
  name: String!
  photo: String
  createdAt: DateTime!
  updatedAt: DateTime
}

"""
A human user of the system.
Multi-label: ["Person", "User"]
Authorization: Any authenticated user can view any Person (allows profile viewing after search).
Dashboard filtering is handled in queries, not authorization.
Merged properties from reference schema for backward compatibility.
"""
type Person implements PersonInterface
  @node(labels: ["Person"])
  @authorization(
    # WRITE — a Person may only be updated or deleted by the user it
    # represents. This closes the IDOR where any authenticated caller could
    # updatePeople(where: { id_EQ: <victim> }) / deletePeople and overwrite
    # another person's profile. READ stays open: any authenticated user can
    # look up a Person (directory lookup, per kb/02-user-roles.md). CREATE is
    # intentionally not gated — Person nodes are created by the trusted
    # server-side auth routes via direct Cypher, never this mutation.
    validate: [
      {
        operations: [UPDATE, DELETE]
        where: { node: { id_EQ: "$jwt.user.id" } }
      }
    ]
  ) {
  id: ID! @id
  isUser: Boolean
    @cypher(
      statement: """
      MATCH (this) WHERE this:User
      RETURN true AS isUser
      """
      columnName: "isUser"
    )
  
  # Core identity properties
  firstName: String!
  lastName: String!
  name: String! @customResolver(requires: "firstName lastName")

  # ── GOAL-275 sensitive-field READ gate (write/filter side) ─────────────────
  # The Person type stays open for directory lookup: id / firstName / lastName /
  # name / photo are readable by any authenticated user (kb/02-user-roles.md).
  # The fields below carry PII or relational narrative and MUST NOT leak across
  # Space boundaries. They remain declared HERE because they are the WRITABLE
  # properties (`updatePeople` sets them) — but they are NOT readable from this
  # type: every one carries `@selectable(onRead: false, onAggregate: false)`, so
  # they appear in no output type and no aggregate selection. None of them is
  # filterable either, `email` included since the enumeration fix — see the note
  # on that field.
  #
  # READS go through `privateProfile` (below), a single `PersonPrivateProfile`
  # over the same `:Person` node carrying ONE type-level `@authorization`
  # filter. See that type's docstring for the policy and the measurements that
  # forced the restructure. The rule that used to be duplicated here on 14
  # fields now exists in exactly one place.
  #
  # The policy is unchanged. A read is authorized only when the caller
  #   • is the person           (id_EQ $jwt.user.id), OR
  #   • created the person node  (createdBy_SOME id_EQ $jwt.user.id — their own
  #                               imported / ingested contact), OR
  #   • shares a Space with them (co-owner or co-member of any Space they own /
  #                               belong to), OR
  #   • can view a FieldContext that holds them (contexts_SOME — the person is
  #     attached via HAS_PERSON to a FieldContext whose parent Space the caller
  #     owns or is a member of). This is the ONLY Space tie a PersonPulse has:
  #     relational-world people own no Space and hold no SpaceMembership, so
  #     without this branch every ingest/assistant-created person was filtered
  #     out of any query selecting a gated field — including for the very user
  #     who created them in their own MeSpace (the "uploaded a document but the
  #     people never appeared" failure). The branch mirrors FieldContext's own
  #     READ filter, so it authorizes exactly the people the caller could
  #     already reach by opening that context. No cross-Space widening for
  #     PersonPulses; for `:User` persons, PII reach equals context reach, so
  #     the HAS_PERSON attach side is gated to match: the generated nested
  #     CONNECT is disabled (FieldContext.people / Person.contexts carry
  #     `nestedOperations: [DISCONNECT]`), and the sole attach path — the
  #     custom `addPersonToFieldContext` mutation — refuses a `:User` target
  #     unless they are the caller or already own / belong to the context's
  #     parent Space. The declarative filter here cannot express "NOT :User",
  #     which is exactly why that guard lives in the resolver, not this rule.
  #
  # MECHANISM: an unauthorized caller now gets the Person row with
  # `privateProfile: null` instead of no row at all. That is strictly less
  # information than the old behaviour leaked anyway — name / photo are already
  # public cross-Space by design (SEARCH_PEOPLE_QUERY), and the PII itself is
  # still withheld. It also removes the trap that every PII surface had to
  # render a graceful not-found for a person who plainly exists.
  #
  # SORTING: `@sortable(byValue: false)` on every scalar below is load-bearing
  # and is NOT implied by `@selectable(onRead: false)` — verified by building
  # the schema both ways: without it, all twelve stay in `PersonSort`. Ordering
  # is a comparison oracle. Under the old design
  # `people(sort: [{ location: ASC }], limit: 5) { id name }` compiled to a bare
  # `MATCH (this:Person) … ORDER BY this.location` with ZERO auth predicates —
  # the rule never fired because no gated field was *selected* — letting any
  # authenticated caller order every Person by `email` / `phone` / `careManual`
  # and binary-search values with `sort` + `limit` + `offset`. That hole
  # predates this change; these directives close it.
  #
  # AGGREGATION: field-level rules do NOT gate aggregate selections —
  # `peopleAggregate { email { shortest } }` was confirmed to return real
  # cross-Space emails. `@selectable(onAggregate: false)` on each scalar here
  # removes it from ALL aggregate selection types at schema-build time, and
  # `PersonPrivateProfile` carries `@query(aggregate: false)` so it has no
  # aggregate root of its own. Plain `count` aggregates are unaffected.
  #
  # The predicate reuses the exact owner/member pattern from the WeSpace +
  # SpaceMembership authorization filters below, over the pre-existing
  # `ownsSpaces` / `memberOf` / `createdBy` relationships.
  #
  # It DOES add one new filter surface, and the honest accounting is:
  # `PersonWhere` gains `privateProfile: PersonPrivateProfileWhere`, because a
  # `@cypher` field must be filterable for the type-level `@authorization` rule
  # to validate against it (making `Person.privateProfile` unfilterable fails
  # the build outright: `Field "node" is not defined by type`). It leaks no
  # INFORMATION — after the `@filterable(byValue: false)` sweep on
  # `PersonPrivateProfile` it offers only `id_*` plus the four relationship
  # predicates, all of which already exist verbatim on `PersonWhere`. But it is
  # a COST multiplier: `people(where: { privateProfile: { id_EQ: … } })`
  # compiles to a label scan plus a per-row `CALL` (measured 2,439 dbHits on a
  # 1,216-Person fixture, against 5 for the equivalent `people(where: { id_EQ
  # })` index seek), because the predicate lands below the `CALL` and cannot be
  # pushed out — the same trap documented on `PersonPrivateProfile`.
  #
  # It is deliberately NOT special-cased in a validation rule, because an
  # unfiltered `people { privateProfile { email } }` already costs at least as
  # much and always has. The general mitigation is query complexity/depth
  # limiting on `/api/graphql`, not a `privateProfile`-shaped patch that would
  # leave the cheaper path open. That limiting now exists — see
  # `src/lib/graphql/query-limits.ts` (cost / depth / alias / token ceilings,
  # each set against the measured maximum over the app's own documents).
  # The `createdBy_SOME` branch closes the regression where a user could not
  # open the profile of a non-member contact they themselves imported/ingested
  # (e.g. a document-extracted PersonPulse): such a contact owns no Space and is
  # a member of none, so the owner/member branches miss it, yet it is created
  # by — and belongs to — the caller. It only ever unlocks persons the caller
  # created, and CREATED_BY edges are written server-side (never via the
  # self-gated updatePeople), so it cannot be forged to reach a stranger's PII.
  # A legacy CONNECTED_TO edge, by contrast, does NOT unlock these fields —
  # an edge records a claim by its author, never the far endpoint's consent.
  # Note this also USED to be undermined by its own escape hatch: the
  # `connections` / `connectionEdges` `@cypher` fields generated
  # `PersonWhere.connections_SOME`, so `people(where: { connections_SOME: {
  # id_EQ: … } })` did expose exactly the cross-Space connection-graph
  # enumeration this rule is meant to prevent. Moving both fields onto
  # `PersonPrivateProfile` and marking them `@filterable(byValue: false)`
  # removes that predicate from the schema entirely. CONNECTED_TO is legacy
  # (migrating to ResonanceLinks), so createdBy / sharing a Space are the
  # intended paths to a person's private profile.
  # ────────────────────────────────────────────────────────────────────────────
  # `email` is NOT filterable, and that is load-bearing. @neo4j/graphql v6 has
  # no operator-level control: declaring a field filterable generates `_EQ`
  # AND `_IN` / `_CONTAINS` / `_STARTS_WITH` / `_ENDS_WITH` together. While
  # this field was filterable, `people(where: { email_STARTS_WITH: "a" }) { id
  # name }` was an account-enumeration oracle for any authenticated caller —
  # recover any registered address character by character, or confirm whether
  # a given person has an account. `peopleAggregate(where: …) { count }` leaked
  # the same signal while returning no rows, so no row-level defence saw it.
  # An `@authorization` filter gates PROJECTIONS, not `where` predicates (see
  # the long note on PersonPrivateProfile), so gating the VALUE never closed
  # this; only removing the predicate does.
  #
  # It was kept filterable for `people(where: { email_EQ })`, the login
  # self-bootstrap behind GET_LOGGED_IN_USER. That lookup did not actually
  # need email: JWT `user.id` IS the `Person.id`, the login/signup responses
  # already hand the client its own `id`, and every authorization rule on this
  # type matches on `id` anyway. GET_LOGGED_IN_USER now keys on `id_EQ`, which
  # is an index seek instead of a property scan and cannot be pointed at
  # another account. No caller needs an email predicate; if one ever does, it
  # is a narrow custom resolver (`findPersonByEmail`, rate-limited, exact match
  # only), never re-opening this surface.
  #
  # `@filterable(byValue: false)` here also removes
  # `PersonConnectionWhere` / `PersonSort` exposure of the field — pinned by
  # `person-pii-read-auth.integration.test.ts`.
  email: String
    @filterable(byValue: false)
    @selectable(onRead: false, onAggregate: false)
    @sortable(byValue: false)

  # Profile properties (merged from reference).
  # photo/avatar/status stay open (directory / presence — non-PII); the PII
  # scalars — including `gender`, which is collected on the person forms — are
  # read-gated via `privateProfile`.
  photo: String
  phone: String
    @filterable(byValue: false)
    @selectable(onRead: false, onAggregate: false)
    @sortable(byValue: false)
  pronouns: String
    @filterable(byValue: false)
    @selectable(onRead: false, onAggregate: false)
    @sortable(byValue: false)
  location: String
    @filterable(byValue: false)
    @selectable(onRead: false, onAggregate: false)
    @sortable(byValue: false)
  avatar: String
  status: String
  gender: String
    @filterable(byValue: false)
    @selectable(onRead: false, onAggregate: false)
    @sortable(byValue: false)

  # Rich profile content
  # `description` is a short relational note about a PersonPulse — who they are
  # in the user's world. Distinct from the CONNECTED_TO `why` (how the user
  # relates to them). Populated by the assistant at create time and editable via
  # the authorized `updatePersonPulse` mutation (NOT the self-gated updatePeople).
  description: String
    @filterable(byValue: false)
    @selectable(onRead: false, onAggregate: false)
    @sortable(byValue: false)
  careManual: String
    @filterable(byValue: false)
    @selectable(onRead: false, onAggregate: false)
    @sortable(byValue: false)
  favorites: String
    @filterable(byValue: false)
    @selectable(onRead: false, onAggregate: false)
    @sortable(byValue: false)
  passions: String
    @filterable(byValue: false)
    @selectable(onRead: false, onAggregate: false)
    @sortable(byValue: false)
  traits: String
    @filterable(byValue: false)
    @selectable(onRead: false, onAggregate: false)
    @sortable(byValue: false)
  fieldsOfCare: String
    @filterable(byValue: false)
    @selectable(onRead: false, onAggregate: false)
    @sortable(byValue: false)
  interests: String
    @filterable(byValue: false)
    @selectable(onRead: false, onAggregate: false)
    @sortable(byValue: false)

  # Authentication properties (for users)
  password: String @private
  refreshToken: String @private
  refreshTokenExp: DateTime
  refreshTokenRevoked: Boolean
  authId: String
  # @private: the vector is derived from GOAL-275-gated profile content
  # (description, passions, traits) — an ungated readable copy would undo the
  # field gates (embedding inversion recovers short texts). No client selects
  # it; server-side vector search reads it via Cypher, which @private ignores.
  embedding: [Float!] @private
  signupDate: DateTime

  # Onboarding (modern schema)
  onboardingCurrentStepIndex: Int
  onboardingCompletedSteps: [String!]
  onboardingIsCompleted: Boolean
  onboardingSkipped: Boolean

  # Persisted focal entity. Mirrors the client-side FocalEntityContext so
  # the user's "where I last was" survives a fresh browser / new device.
  # All four are written together on every change; null when no focal is set.
  # Type is one of the FocalEntityType discriminators
  # (MeSpace/WeSpace/FieldContext/User/PersonPulse/<Pulse subtype>) —
  # validated server-side via isFocalEntityType.
  #
  # READ is self-only. These are browsing state, not profile data: together
  # they say *what* a user last looked at and *when*. `lastFocalLabel` holds
  # the entity's display name — a person's name, a private FieldContext title,
  # a MeSpace pulse title — so leaving it ungated handed any authenticated
  # caller a cross-Space activity feed for every other user, routing around
  # the GOAL-275 PII gate for exactly the entities that gate protects. The
  # only production reader/writer is /api/user/focal-entity, which scopes to
  # `resolveAuthenticatedUserId` in raw Cypher and never goes through these
  # fields, so no query loses data. `onAggregate: false` matches the GOAL-275
  # fields: field-level rules do not gate aggregate selections, so a
  # `peopleAggregate { lastFocalLabel { longest } }` would otherwise leak the
  # value straight back out.
  lastFocalType: String
    @filterable(byValue: false)
    @sortable(byValue: false)
    @selectable(onRead: true, onAggregate: false)
    @authorization(
      filter: [
        { operations: [READ], where: { node: { id_EQ: "$jwt.user.id" } } }
      ]
    )
  lastFocalId: String
    @filterable(byValue: false)
    @sortable(byValue: false)
    @selectable(onRead: true, onAggregate: false)
    @authorization(
      filter: [
        { operations: [READ], where: { node: { id_EQ: "$jwt.user.id" } } }
      ]
    )
  lastFocalLabel: String
    @filterable(byValue: false)
    @sortable(byValue: false)
    @selectable(onRead: true, onAggregate: false)
    @authorization(
      filter: [
        { operations: [READ], where: { node: { id_EQ: "$jwt.user.id" } } }
      ]
    )
  lastFocalAt: DateTime
    @filterable(byValue: false)
    @sortable(byValue: false)
    @selectable(onRead: true, onAggregate: false)
    @authorization(
      filter: [
        { operations: [READ], where: { node: { id_EQ: "$jwt.user.id" } } }
      ]
    )

  # Timestamps
  createdAt: DateTime!
    @timestamp(operations: [CREATE])
    @settable(onCreate: true, onUpdate: false)
  updatedAt: DateTime
    @timestamp(operations: [UPDATE])
    @settable(onCreate: false, onUpdate: true)

  # Modern relationships (pulse-first architecture)
  ownsSpaces: [Space!]! @relationship(type: "OWNS", direction: OUT)
  memberOf: [SpaceMembership!]! @relationship(type: "IS_MEMBER", direction: IN)

  """
  The gated read view of this person — the single place every PII scalar and
  the person-to-person connection graph is readable from. Null when the caller
  is not authorized (see `PersonPrivateProfile`), which is how the GOAL-275
  policy fails closed. Resolves to the same `:Person` node, so it costs one
  projection subquery on the rows the query already matched.
  """
  privateProfile: PersonPrivateProfile
    @cypher(
      statement: """
      MATCH (this)
      RETURN this AS privateProfile
      """
      columnName: "privateProfile"
    )

  # PULSE ACCESS: Pulses are accessed through FieldContexts in owned/member Spaces
  # To get a person's pulses:
  #   1. Query ownsSpaces → get MeSpaces/WeSpaces
  #   2. Query contexts on those spaces → get FieldContexts
  #   3. Query pulses on those contexts → get GoalPulse/ResourcePulse/StoryPulse
  # Same HAS_PERSON write-gate as FieldContext.people, from the Person side:
  # updatePeople's UPDATE validate limits the target to the caller's own node,
  # but an open nested CONNECT here still let a caller inject THEMSELVES into
  # any FieldContext by id. Attach flows go through `addPersonToFieldContext`.
  contexts: [FieldContext!]!
    @relationship(
      type: "HAS_PERSON"
      direction: IN
      nestedOperations: [DISCONNECT]
    )
  #
  # MIGRATION: Legacy direct pulse relationships (goals, resources, coreValues, carePoints)
  # are transformed into pulses within FieldContexts in the person's auto-created MeSpace.

  createdBy: [Person!]! @relationship(type: "CREATED_BY", direction: OUT)
  """
  Documents this person was extracted from (doc-ingestion provenance — see GOAL-242 + ADR-0002).
  Empty for manually-created Person nodes. Each Document is auth-filtered via its own
  @authorization directive, so non-members of the parent Space see an empty list even if
  the underlying EXTRACTED_FROM edge exists.
  """
  extractedFrom: [Document!]! @relationship(type: "EXTRACTED_FROM", direction: OUT)
  """
  Pulses (goal/resource/story) this person was identified as related to / named
  in but is not the author of (GOAL-298, MENTIONED_IN). Each FieldPulse is
  auth-filtered by its own directive, so a non-member of the parent Space sees an
  empty list. Written server-side by the doc-ingestion link path; open nested
  CONNECT is disabled.
  """
  mentionedIn: [FieldPulse!]!
    @relationship(
      type: "MENTIONED_IN"
      direction: OUT
      nestedOperations: [DISCONNECT]
    )
  """
  Pulses this person authored — the reverse of `FieldPulse.initiatedBy`, the
  canonical `(:FieldPulse)-[:INITIATED_BY]->(:Person)` author edge written by
  the assistant + doc-ingestion paths (GOAL-298). A relational-world
  PersonPulse owns no Space, so the profile/drawer surfaces can only reach the
  pulses they authored through this edge, not through owned WeSpaces — without
  it, an upload-created person's contributions never render (GOAL-314). Each
  FieldPulse is auth-filtered by its OWN @authorization directive, so a
  non-member of the parent Space sees an empty list even though the edge
  exists. Open nested CONNECT is disabled — authorship is written server-side
  at pulse-create time, never via a client mutation on Person.
  """
  initiatedPulses: [FieldPulse!]!
    @relationship(
      type: "INITIATED_BY"
      direction: IN
      nestedOperations: [DISCONNECT]
    )
}

"""
The GOAL-275 gated read view of a `:Person` — every PII scalar plus the
person-to-person connection graph, behind ONE type-level `@authorization`
filter. Reached only through `Person.privateProfile`; it has no root query and
no mutations of its own.

WHY THIS TYPE EXISTS (do not fold these fields back onto `Person`):
`@neo4j/graphql` v6 expands a FIELD-level `@authorization` filter once per
gated field in the selection set, with no deduplication, and Neo4j's planning
cost is super-linear in the resulting predicate count. Measured on a
1,000-person fixture against dev Aura, selecting N gated fields from `Person`
when each carried its own copy of the rule below:

  | gated fields | EXISTS | cold plan |
  |      1       |   29   |   1.1 s   |
  |      4       |  116   |   2.8 s   |
  |      8       |  232   |  12.1 s   |
  |     12       |  348   |  31.4 s   |

GET_LOGGED_IN_USER — which fires on every protected page — sat at the bottom
of that table and blew the 60 s `maxDuration` on `/api/graphql`
(src/app/api/graphql/route.ts), which is what surfaced as the profile page
hanging forever. A TYPE-level filter is emitted exactly ONCE regardless of how
many fields are selected, so the cost is now flat in field count: this schema
now emits 29 EXISTS whether the caller selects one gated field or all twelve
(`person-pii-gate-plan-size.test.ts` asserts that equality). End to end on the
same fixture, GET_PERSON_PROFILE went from 20,442 ms cold / 168 dbHits /
38,761 characters of Cypher to 1,553 ms / 33 dbHits / 7,510 characters.

Rejected alternative, for the record: keeping the fields on `Person` and
pointing their filters at a single `@cypher` Boolean gate. That does cut
planning, but `@neo4j/graphql` emits a cypher-field filter as
`MATCH (this:Person) CALL { … } WITH * WHERE this.id = $param`, and Neo4j will
NOT push a predicate below a `CALL` subquery (measured: 3 dbHits with the
predicate before the CALL, 3,021 after). The gate therefore ran for every
Person in the database on a single-row lookup — 168 dbHits became 146,453,
scaling with database size. A type-level filter stays declarative and inlines
into the `WHERE`, so the index seek survives.

AUTHORIZATION — the policy is byte-for-byte the rule that used to be
duplicated on 14 fields, and is documented in full on `Person` above. A read is
authorized when the caller is the person, created them, shares a Space with
them, or can view a FieldContext holding them.

Two consequences of the `contexts_SOME` branch worth stating, both unchanged
from the original rule and both covered by
`person-pii-read-auth.integration.test.ts`:
  • A nested sub-context (`HAS_SUBCONTEXT`, GOAL-295) DOES unlock PII, because
    every context — nested or not — also hangs off its Space by its own
    `HAS_CONTEXT` edge, which is what `meSpace_SOME` / `weSpace_SOME` traverse.
  • A soft-deleted context does NOT, because GOAL-319 re-points that edge to
    `HAS_DELETED_CONTEXT`. Deleting a field therefore withdraws the PII reach
    it granted.

`@query(read: false, aggregate: false)` — no `personPrivateProfiles` root and
no aggregate root. Without it this type would be a second, parallel read path
over the same `:Person` nodes, exactly the leak that the `PersonInterface` and
`LifeSensor` lockdowns close.
`@mutation(operations: [])` — no create/update/delete. Writes keep going
through `Person` (self-gated `updatePeople`) and the authorized
`updatePersonPulse` resolver.
`@subscription(events: [])` — matches the `SearchResults` / `PersonSearchResult`
lockdown. Subscriptions are not enabled in `apollo-server.ts` today, so this is
latent, but a gated type should not be the one that forgets it.
"""
type PersonPrivateProfile
  @node(labels: ["Person"])
  @query(read: false, aggregate: false)
  @mutation(operations: [])
  @subscription(events: [])
  @authorization(
    filter: [
      {
        operations: [READ]
        where: {
          node: {
            OR: [
              { id_EQ: "$jwt.user.id" }
              { createdBy_SOME: { id_EQ: "$jwt.user.id" } }
              {
                ownsSpaces_SOME: {
                  OR: [
                    { owner_SOME: { id_EQ: "$jwt.user.id" } }
                    { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } }
                  ]
                }
              }
              {
                memberOf_SOME: {
                  space_SOME: {
                    OR: [
                      { owner_SOME: { id_EQ: "$jwt.user.id" } }
                      { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } }
                    ]
                  }
                }
              }
              {
                contexts_SOME: {
                  OR: [
                    { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                    { meSpace_SOME: { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } } }
                    { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                    { weSpace_SOME: { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } } }
                  ]
                }
              }
            ]
          }
        }
      }
    ]
  ) {
  """
  Same value as `Person.id`. Kept so the filter above can express the
  "caller is the person" branch, and so Apollo can normalize the object.
  """
  id: ID!

  # ── `@filterable(byValue: false)` on EVERY field below is a HARD REQUIREMENT ──
  # An `@authorization` filter gates PROJECTIONS, not `where` predicates. Left
  # filterable, these scalars generate a full `PersonPrivateProfileWhere`
  # (`_EQ` / `_IN` / `_CONTAINS` / `_STARTS_WITH` / `_ENDS_WITH` per field) that
  # `@neo4j/graphql` hangs off `PersonWhere` as `privateProfile:`. That turns
  # the gate inside out: an unrelated caller cannot READ `careManual`, but
  # `people(where: { privateProfile: { careManual_STARTS_WITH: "a" } }) { id }`
  # answers "does it start with a?" for EVERY Person in the database, so the
  # whole value is recoverable character by character. `peopleAggregate(where:
  # …) { count }` leaks the same signal while returning no rows at all, so no
  # row-level defence sees it. The surface follows `PersonWhere` everywhere it
  # is accepted — `people`, `peopleConnection`, `peopleAggregate`,
  # `Space.owner(where:)`, `FieldContext.people(where:)`, and so on.
  #
  # These fields were `@filterable(byValue: false)` on `Person` before the
  # restructure, so omitting it here is a silent REGRESSION, not a new gap.
  # `id` deliberately stays filterable — the rule above needs `id_EQ` — as do
  # the four relationships below, which need `*_SOME`.
  # Pinned by `person-pii-read-auth.integration.test.ts`.
  email: String @filterable(byValue: false)
  phone: String @filterable(byValue: false)
  pronouns: String @filterable(byValue: false)
  location: String @filterable(byValue: false)
  gender: String @filterable(byValue: false)
  description: String @filterable(byValue: false)
  careManual: String @filterable(byValue: false)
  favorites: String @filterable(byValue: false)
  passions: String @filterable(byValue: false)
  traits: String @filterable(byValue: false)
  fieldsOfCare: String @filterable(byValue: false)
  interests: String @filterable(byValue: false)

  """
  Person-to-person connections. Legacy — should migrate to ResonanceLinks.
  Each endpoint is itself a `Person`, so the endpoint's own PII stays behind
  its own `privateProfile` gate and is not widened by appearing here.

  `@filterable(byValue: false)` removes the generated `connections_SOME`
  predicate. That predicate is what would actually expose the CONNECTED_TO
  graph for cross-Space enumeration — the leak the `Person` docstring above
  describes.
  """
  connections: [Person!]!
    @filterable(byValue: false)
    @cypher(
      statement: """
      MATCH (this)-[:CONNECTED_TO]-(other:Person)
      RETURN other
      """
      columnName: "other"
    )
  """
  The CONNECTED_TO edge properties (`why` / `interests`) flattened alongside the
  far endpoint's id — the relational narrative, gated with the rest of the PII.
  """
  connectionEdges: [PersonConnectionEdge!]!
    @filterable(byValue: false)
    @cypher(
      statement: """
      MATCH (this)-[r:CONNECTED_TO]-(other:Person)
      RETURN {connectedPersonId: other.id, why: r.why, interests: r.interests} AS connectionEdge
      """
      columnName: "connectionEdge"
    )

  # Relationship fields required by the @authorization filter above — the
  # `*_SOME` predicates only exist in PersonPrivateProfileWhere if the
  # relationships are declared on this type. They exist ONLY to be filtered on:
  # `Person` already exposes the same four edges, each auth-filtered by its own
  # target type, so re-exposing them here would be duplicate surface.
  #
  # All three directives are load-bearing, and `@selectable` alone is NOT
  # enough. `@selectable(onRead: false)` drops the plain field but leaves the
  # generated `ownsSpacesConnection` / `ownsSpacesAggregate` companions
  # reachable (verified against the built schema); `aggregate: false` on the
  # `@relationship` is what removes BOTH. `nestedOperations: []` is
  # belt-and-braces — `@mutation(operations: [])` already means this type has
  # no create/update inputs for a nested write to hang off.
  #
  # After all three, the built type exposes exactly: id, the 12 PII scalars,
  # connections, connectionEdges. If you add a relationship here, re-check the
  # built type — do not assume `@selectable` covered it.
  ownsSpaces: [Space!]!
    @relationship(type: "OWNS", direction: OUT, nestedOperations: [], aggregate: false)
    @selectable(onRead: false, onAggregate: false)
  memberOf: [SpaceMembership!]!
    @relationship(type: "IS_MEMBER", direction: IN, nestedOperations: [], aggregate: false)
    @selectable(onRead: false, onAggregate: false)
  contexts: [FieldContext!]!
    @relationship(type: "HAS_PERSON", direction: IN, nestedOperations: [], aggregate: false)
    @selectable(onRead: false, onAggregate: false)
  createdBy: [Person!]!
    @relationship(type: "CREATED_BY", direction: OUT, nestedOperations: [], aggregate: false)
    @selectable(onRead: false, onAggregate: false)
}

"""
User authentication and preferences.
Extends Person with login and feature flags.
Multi-label: ["Person", "User"]
Authorization: the auto-generated `users` READ query is disabled (GOAL-275).
Every :User node also carries the :Person label, so it is readable through the
`people` query — where the Person type's field-level PII gate applies. Exposing
a second, UNGATED read path here (`users { email … }`) let any authenticated
caller enumerate every registered account's PII, bypassing that gate. Legitimate
by-email member lookup goes through the narrow, exact-match `findUserByEmail`
resolver (user-lookup-resolver.ts), not a broad `users` scan.
"""
type User implements PersonInterface
  @node(labels: ["Person", "User"])
  # Disable the auto-generated `users` / `usersConnection` / `usersAggregate`
  # READ queries. This is the READ half of GOAL-275: without it, the ungated
  # User type re-opens the cross-Space PII leak that the Person field-auth gate
  # closes (a :User is the same node as a :Person, just addressed by a second
  # GraphQL type). :User nodes stay readable — gated — via `people`.
  @query(read: false, aggregate: false)
  # Drop the auto-generated `createUsers` mutation entirely. A :User carries
  # auth state (password, refreshToken) and is the login identity, so an
  # ungated create let any authenticated token holder mint an arbitrary
  # account with a chosen email + password outside the normalized signup
  # path. :User nodes are only ever created by the trusted auth routes
  # (signup / accept-invite) via direct Cypher. UPDATE/DELETE stay (still
  # owner-scoped by the @authorization below). Mirrors the MeSpace pattern.
  @mutation(operations: [UPDATE, DELETE])
  @authorization(
    # Same owner-scoping as Person. The User type additionally exposes auth
    # fields (password / refreshToken are @private), so gating updateUsers /
    # deleteUsers to the authenticated user is critical — otherwise any token
    # holder could rewrite another account. Auth routes mutate these via
    # direct Cypher, not GraphQL, so they are unaffected.
    validate: [
      {
        operations: [UPDATE, DELETE]
        where: { node: { id_EQ: "$jwt.user.id" } }
      }
    ]
  ) {
  id: ID! @id
  firstName: String!
  lastName: String!
  name: String! @customResolver(requires: "firstName lastName")
  # Not filterable, for the same reason as `Person.email` — see the long note
  # there. `@query(read: false)` removes the `users` root, but `UserWhere` is
  # still reachable through `updateUsers` / `deleteUsers`, and the `validate`
  # rule below turns those into an oracle rather than closing one: a `where`
  # that matches somebody else's account raises Forbidden while one that
  # matches nothing succeeds, so `updateUsers(where: { email_STARTS_WITH: "a" })`
  # answers "does any account start with a?". Closing this on `Person` alone
  # would have been half a fix. Nothing filters users by email — the by-email
  # member lookup is the exact-match `findUserByEmail` resolver.
  email: String @filterable(byValue: false)

  # Profile properties
  photo: String
  phone: String
  pronouns: String
  location: String
  avatar: String
  status: String
  gender: String
  
  # Rich profile content
  passions: String
  traits: String
  fieldsOfCare: String
  interests: String
  
  # Authentication & preferences
  aiEnabled: Boolean!
  password: String @private
  refreshToken: String @private
  refreshTokenExp: DateTime
  refreshTokenRevoked: Boolean
  authId: String
  # @private: same rationale as Person.embedding — derived from gated content.
  embedding: [Float!] @private
  signupDate: DateTime

  # Onboarding
  onboardingCurrentStepIndex: Int!
  onboardingCompletedSteps: [String!]!
  onboardingIsCompleted: Boolean!
  onboardingSkipped: Boolean!
  
  # Timestamps
  createdAt: DateTime!
    @timestamp(operations: [CREATE])
    @settable(onCreate: true, onUpdate: false)
  updatedAt: DateTime
    @timestamp(operations: [UPDATE])
    @settable(onCreate: false, onUpdate: true)
  
  ownsSpaces: [Space!]! @relationship(type: "OWNS", direction: OUT)
}

"""
Anything that can initiate pulses or own spaces.
Query-time abstraction.

MIGRATION NOTES:

1. Community Transformation:
   - Community nodes → WeSpace nodes with merged properties
   - BELONGS_TO relationships → SpaceMembership nodes with appropriate roles
   - Community owners → Space owners via OWNS relationship

2. Pulse Creation Pattern:
   - User pulses: Create FieldContext in auto-created MeSpace ("{User's name} MeSpace")
   - Community pulses: Create FieldContext ("{Community name} Field") in WeSpace
   - All pulses live ONLY within FieldContexts
   - Pulse relationships → ResonanceLinks within the FieldContext

3. Example Migration:
   Person "Alice" MOTIVATED_BY Goal "Launch App" →
     a. Create MeSpace "Alice MeSpace" (owner: Alice)
     b. Create FieldContext "Alice's Goals" in MeSpace
     c. Create GoalPulse "Launch App" in FieldContext
     d. Alice can access via: ownsSpaces → contexts → pulses
   
   Community "Tech Team" MOTIVATED_BY Goal "Ship v2.0" →
     a. Create WeSpace "Tech Team" with community properties
     b. Create FieldContext "Tech Team Field" in WeSpace
     c. Create GoalPulse "Ship v2.0" in FieldContext
     d. Members can access via: memberOf → space → contexts → pulses
"""
# @query(read: false): same reason as PersonInterface — this union's
# auto-generated `lifeSensors` root reads `:Person` nodes without the
# GOAL-275 field-auth gate, leaking cross-Space PII. Unused by the app
# (the schema-graph page shows a static "LifeSensors" label, not a query).
union LifeSensor @query(read: false) = Person

# ============================================================================
# SPACES (Privacy + Ownership Boundary)
# ============================================================================

"""
Abstract space type.
Never instantiated directly - use MeSpace or WeSpace.
Expanded with Community properties from reference schema.
"""
interface Space {
  id: ID!
  name: String!
  visibility: SpaceVisibility!
  
  # Merged community properties
  description: String
  why: String
  location: String
  time: String
  activities: String
  resultsAchieved: String
  status: String
  
  createdAt: DateTime!
  owner: [Person!]! @declareRelationship
  members: [SpaceMembership!]! @declareRelationship
  contexts: [FieldContext!]! @declareRelationship
}

"""
A personal space owned by one person.
Can be private (only owner) or shared with specific members.
Multi-label: ["Space", "MeSpace"]
Authorization: Only the owner can view, create, update, or delete a MeSpace.
"""
type MeSpace implements Space
  @node(labels: ["Space", "MeSpace"])
  # Disables the auto-generated `createMeSpaces` root mutation.
  # All MeSpace creation MUST go through /api/me-space/create which
  # enforces the "one per Person" invariant atomically (with WHERE NOT
  # EXISTS) and denormalizes `ownerId` so the DB UNIQUE constraint
  # (see scripts/init-db.js → mespace_owner_unique) holds. Allowing
  # CREATE here would let an authenticated user spawn a second MeSpace
  # via the Apollo client / GraphQL playground, bypassing the guard.
  # See kb/03-workflows.md:41 and kb/05-data-entities.md for the rule.
  @mutation(operations: [UPDATE, DELETE])
  @authorization(
    filter: [{ where: { node: { owner_SOME: { id_EQ: "$jwt.user.id" } } } }]
  ) {
  id: ID! @id
  name: String!
  visibility: SpaceVisibility!
  
  # Community properties
  description: String
  why: String
  location: String
  time: String
  activities: String
  resultsAchieved: String
  status: String
  
  createdAt: DateTime!
  owner: [Person!]! @relationship(type: "OWNS", direction: IN)
  members: [SpaceMembership!]! @relationship(type: "HAS_MEMBER", direction: OUT)
  # Nested DELETE/DISCONNECT are disabled (GOAL-319): a nested
  # `contexts: { delete: ... }` ran the same bare DETACH DELETE the removed
  # deleteFieldContexts mutation did (orphaning every nested pulse), and a
  # nested disconnect stranded the context invisible AND un-purgeable (the
  # purge cron matches on deletedAt, which a disconnect never sets). All
  # deletion flows through the custom `deleteFieldContext` mutation.
  contexts: [FieldContext!]!
    @relationship(
      type: "HAS_CONTEXT"
      direction: OUT
      nestedOperations: [CONNECT, CREATE, UPDATE]
    )
}

"""
A collaborative space shared with other people.
Has an owner and members who can all participate.
Multi-label: ["Space", "WeSpace"]
Authorization: Owner and members can access. Non-members cannot.
"""
type WeSpace implements Space
  @node(labels: ["Space", "WeSpace"])
  @authorization(
    # READ — owner or any member can see the space.
    filter: [
      {
        where: {
          node: {
            OR: [
              { owner_SOME: { id_EQ: "$jwt.user.id" } }
              { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } }
            ]
          }
        }
      }
    ]
    # WRITE — UPDATE and DELETE are owner-only per kb/02-user-roles.md
    # (members manage content inside the space, not the space itself).
    # CREATE requires the new owner to be the authenticated user — this
    # blocks the attack where a caller posts `owner.connect` pointing at
    # another Person's id to back-door themselves into someone else's
    # space. Legit creators (REST /api/we-space/create + csv-import-service)
    # already pass `user.id` as the owner, so this is invisible to them.
    validate: [
      {
        operations: [CREATE]
        where: { node: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
      }
      {
        operations: [UPDATE, DELETE]
        where: { node: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
      }
    ]
  ) {
  id: ID! @id
  name: String!
  visibility: SpaceVisibility!
  
  # Community properties
  description: String
  why: String
  location: String
  time: String
  activities: String
  resultsAchieved: String
  status: String
  
  createdAt: DateTime!
  owner: [Person!]! @relationship(type: "OWNS", direction: IN)
  members: [SpaceMembership!]! @relationship(type: "HAS_MEMBER", direction: OUT)
  # Nested DELETE/DISCONNECT are disabled (GOAL-319): a nested
  # `contexts: { delete: ... }` ran the same bare DETACH DELETE the removed
  # deleteFieldContexts mutation did (orphaning every nested pulse), and a
  # nested disconnect stranded the context invisible AND un-purgeable (the
  # purge cron matches on deletedAt, which a disconnect never sets). All
  # deletion flows through the custom `deleteFieldContext` mutation.
  contexts: [FieldContext!]!
    @relationship(
      type: "HAS_CONTEXT"
      direction: OUT
      nestedOperations: [CONNECT, CREATE, UPDATE]
    )
}

"""
Represents a person as a member of a space with a specific role.
Label: ["SpaceMembership"]
Authorization: Only accessible if current user is an owner or member of the associated space.
"""
type SpaceMembership
  @node(labels: ["SpaceMembership"])
  @authorization(
    filter: [
      {
        where: {
          node: {
            space_SOME: {
              OR: [
                # Current user is the owner of the space
                { owner_SOME: { id_EQ: "$jwt.user.id" } }
                # Current user is a member of the space
                { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } }
              ]
            }
          }
        }
      }
    ]
  ) {
  id: ID! @id
  role: SpaceRole!
  addedAt: DateTime!
  member: [Person!]! @relationship(type: "IS_MEMBER", direction: OUT)
  space: [Space!]! @relationship(type: "HAS_MEMBER", direction: IN)
}

# ============================================================================
# FIELD CONTEXTS (Thematic/Temporal Containers)
# ============================================================================

"""
A thematic or temporal container inside a Space.
Groups related pulses together.
Label: ["FieldContext"]

MIGRATION PATTERN:
- Each MeSpace gets at least one auto-created FieldContext for user's legacy pulses
- Default naming: "{User's name} Goals", "{User's name} Resources", etc.
- Each WeSpace (former Community) gets a FieldContext named "{Community name} Field"
- All pulses from direct relationships are migrated INTO these contexts
- ResonanceLinks represent relationships between pulses within the same context
"""
type FieldContext
  @node(labels: ["FieldContext"])
  # DELETE is custom-only (GOAL-319): the generated deleteFieldContexts ran a
  # bare DETACH DELETE on the context node, orphaning every nested pulse.
  # Deletion now flows through the custom `deleteFieldContext` mutation, which
  # soft-deletes the context and its pulses (deletedAt stamp + the Space edge
  # re-pointed to HAS_DELETED_CONTEXT) ahead of the 90-day purge cron.
  @mutation(operations: [CREATE, UPDATE])
  @authorization(
    # READ — anyone with access to the owning space (Me owner, or We
    # owner + any member regardless of role) can see the FieldContext.
    filter: [
      {
        where: {
          node: {
            OR: [
              { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
              {
                meSpace_SOME: {
                  members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                }
              }
              { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
              {
                weSpace_SOME: {
                  members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                }
              }
            ]
          }
        }
      }
    ]
    # WRITE — split per kb/02-user-roles.md:
    #   CREATE/UPDATE → owner, ADMIN, or MEMBER (GUESTs are view-only)
    #   DELETE        → owner or ADMIN only (members can't drop fields)
    validate: [
      {
        operations: [CREATE, UPDATE]
        where: {
          node: {
            OR: [
              { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
              { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
              {
                weSpace_SOME: {
                  members_SOME: {
                    AND: [
                      { member_SOME: { id_EQ: "$jwt.user.id" } }
                      { role_IN: [ADMIN, MEMBER] }
                    ]
                  }
                }
              }
            ]
          }
        }
      }
      {
        operations: [DELETE]
        where: {
          node: {
            OR: [
              { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
              { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
              {
                weSpace_SOME: {
                  members_SOME: {
                    AND: [
                      { member_SOME: { id_EQ: "$jwt.user.id" } }
                      { role_EQ: ADMIN }
                    ]
                  }
                }
              }
            ]
          }
        }
      }
    ]
  ) {
  id: ID! @id
  title: String!
  emergentName: String
  createdAt: DateTime!
  createdBy: [Person!]! @relationship(type: "CREATED_BY", direction: OUT)
  # HAS_PERSON connects go through the custom `addPersonToFieldContext`
  # mutation, which gates `:User` targets (attaching a person to a context
  # unlocks their gated PII to the space via the Person contexts_SOME READ
  # branch — so a registered User may only be attached when they are the
  # caller or already own / belong to the context's parent Space). Only
  # DISCONNECT stays generated (RemovePersonFromFieldContext); an open nested
  # CONNECT let any context editor attach an arbitrary User by id.
  people: [Person!]!
    @relationship(
      type: "HAS_PERSON"
      direction: OUT
      nestedOperations: [DISCONNECT]
    )
  """
  Ids of the people a human deliberately placed on this field's roster
  (GOAL-346). Document ingestion attaches every person it identifies via
  HAS_PERSON, so `people` above is dominated by extracted names; those are
  surfaced under their source Document instead, and this list is what
  un-hides one that a member has promoted back onto the roster.

  Returns bare ids, never Person nodes, on purpose. A `@cypher` field is
  materialized outside the field-auth translation, so projecting a Person
  here would bypass the GOAL-275 `privateProfile` gate — the same trap
  `field-context-people-resolver.ts` warns about. Ids carry no PII, and the
  caller already holds the authorized `people` list to join against.

  Absent `curated` reads as not-promoted. That is NOT self-correcting for
  historical data: `update_person` stamps EXTRACTED_FROM onto people who were
  already attached (`hitl.ts` ~1990), so a member added by hand before this
  field existed would be evicted from the roster the first time any document
  named them. `scripts/backfill-curated-roster.js` marks every pre-existing
  hand-added edge curated and MUST run at deploy; after it, an uncurated edge
  reliably means "attached by ingestion".

  Declared as a NULLABLE list. An object-type `@cypher` field has no
  standalone resolver — it is materialized inside the parent's translated
  statement — so a FieldContext produced by a custom root resolver
  (`searchAll`, `createSubFieldContext`, the chat/ingest mutations) yields
  `undefined` here. Under `[ID!]!` that nulls the ENTIRE parent path, which is
  the failure `resolvers/projection.test.ts` guards against.
  """
  curatedPersonIds: [ID!]
    # Not filterable: the generated `curatedPersonIds_INCLUDES` would join
    # `FieldContextWhere`, which is reachable as a NESTED predicate
    # (`people(where: { contexts_SOME: … })`) where the FieldContext READ
    # filter is not applied. Nothing in the type-level rule references this
    # field, so switching it off builds cleanly.
    @filterable(byValue: false, byAggregate: false)
    @cypher(
      statement: """
      MATCH (this)-[r:HAS_PERSON]->(p:Person)
      WHERE r.curated = true
      RETURN p.id AS curatedPersonId
      """
      columnName: "curatedPersonId"
    )
  # Organizations attached to this context (GOAL-298). HAS_ORGANIZATION connects
  # go through the server-side ingest write only; open nested CONNECT is disabled
  # (parity with `people`) so a context editor can't rehome an arbitrary org by id.
  organizations: [Organization!]!
    @relationship(
      type: "HAS_ORGANIZATION"
      direction: OUT
      nestedOperations: [DISCONNECT]
    )
  pulses: [FieldPulse!]! @relationship(type: "HAS_PULSE", direction: OUT)
  documents: [Document!]! @relationship(type: "HAS_DOCUMENT", direction: OUT)
  resonances: [ResonanceLink!]!
    @relationship(type: "HAS_RESONANCE", direction: OUT)
  # Read-only from this side. Weaves are authored through the PromiseWeave
  # root mutations, which carry their own Space-scoped validate rules; leaving
  # nested writes open here is a second, ungated door into the same input tree
  # (GOAL-341 review). Nothing in the app writes weaves through a FieldContext.
  weaves: [PromiseWeave!]!
    @relationship(type: "HAS_WEAVE", direction: OUT, nestedOperations: [])
  # Resonances among the pulses of this context AND its sub-context subtree
  # (GOAL-295): the field is the resonance boundary — sub-contexts organize,
  # they do not partition resonance. The deletedAt filter keeps a soft-deleted
  # sub-context's pulses out (cascade stamps descendants, but a child deleted
  # on its own stays reachable through the HAS_SUBCONTEXT overlay).
  resonancesInContext: [ResonanceLink!]!
    @cypher(
      statement: """
      MATCH (this)-[:HAS_SUBCONTEXT*0..10]->(sc:FieldContext)
      WHERE sc.deletedAt IS NULL
      MATCH (sc)-[:HAS_PULSE]->(pulse:FieldPulse)
      WITH collect(DISTINCT pulse) as contextPulses
      UNWIND contextPulses AS source
      MATCH (source)<-[:SOURCE]-(resonance:ResonanceLink)-[:TARGET]->(target:FieldPulse)
      WHERE target IN contextPulses
      RETURN DISTINCT resonance
      """
      columnName: "resonance"
    )
  # ── Nested sub-contexts (GOAL-295) ─────────────────────────────────────
  # HAS_SUBCONTEXT is a pure hierarchy overlay: every context (root or
  # nested) ALSO keeps its own (Space)-[:HAS_CONTEXT] edge, which is what
  # every read/auth/soft-delete/discovery surface anchors on. Writes go
  # through the custom createSubFieldContext / moveFieldContext mutations
  # only — the invariants (single parent, same Space, no cycles, depth cap)
  # cannot be enforced by generated nested ops — hence nestedOperations: [].
  parentContext: [FieldContext!]!
    @relationship(type: "HAS_SUBCONTEXT", direction: IN, nestedOperations: [])
  subContexts: [FieldContext!]!
    @relationship(type: "HAS_SUBCONTEXT", direction: OUT, nestedOperations: [])
  """
  Ancestor chain ordered root → immediate parent. Empty for a top-level
  context. Drives breadcrumb trails without per-level round-trips.
  """
  ancestorContexts: [FieldContext!]!
    @cypher(
      statement: """
      MATCH path = (a:FieldContext)-[:HAS_SUBCONTEXT*1..10]->(this)
      WITH a, length(path) AS depth
      ORDER BY depth DESC
      RETURN a
      """
      columnName: "a"
    )
  meSpace: [MeSpace!]! @relationship(type: "HAS_CONTEXT", direction: IN)
  weSpace: [WeSpace!]! @relationship(type: "HAS_CONTEXT", direction: IN)
  space: [Space!]!
    @cypher(
      statement: """
      MATCH (this)<-[:HAS_CONTEXT]-(space:Space)
      RETURN space
      """
      columnName: "space"
    )
  owner: [Person!]!
    @cypher(
      statement: """
      MATCH (this)<-[:HAS_CONTEXT]-(space:Space)-[:OWNS]->(owner:Person)
      RETURN owner
      """
      columnName: "owner"
    )
}

# ============================================================================
# DOCUMENTS (Doc Ingestion Provenance — see GOAL-235 + ADR-0002)
# ============================================================================

"""
An uploaded source document attached to a FieldContext. Created by the
direct-to-S3 ingestion flow: POST /api/ingest/document/presign mints a
short-lived presigned PUT URL; the browser uploads straight to S3; POST
/api/ingest/document/process then anchors the Document node and runs
extraction. The original file lives in blob storage (`blobKey` / `blobUrl`);
the graph node carries metadata + provenance edges.

Authorization: inherits from the parent Space — same pattern as FieldContext.
Documents are never auto-deleted; cleanup is user-driven (slice 6 ships the
delete mutation).
"""
type Document
  @node(labels: ["Document"])
  # No generated CRUD (GOAL-292). Every Document write goes through a purpose-
  # built path that owns an invariant the generic mutations cannot: the REST
  # presign/process flow (anchors with a server-minted id + PENDING status), the
  # cron worker (drives the status machine), `reExtractDocument`, and
  # `deleteDocument` (which also removes the blob and clears stale pulse
  # locations). Leaving the generated roots in place let any ADMIN/MEMBER of the
  # Space re-queue ingestion at will via `update: { status_SET: "PENDING" }` —
  # unbounded Gemini/OpenAI spend attributed to the original uploader — plant
  # arbitrary member-visible copy in `statusMessage`, falsify the entity counts,
  # and re-point `uploadedBy` so the worker ran as somebody else.
  @mutation(operations: [])
  @authorization(
    # READ — inherits from the parent FieldContext / Space.
    filter: [
      {
        where: {
          node: {
            fieldContext_SOME: {
              OR: [
                { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  meSpace_SOME: {
                    members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                  }
                }
                { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  weSpace_SOME: {
                    members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                  }
                }
              ]
            }
          }
        }
      }
    ]
    # WRITE — upload/edit/delete require owner, ADMIN, or MEMBER on
    # the owning space. GUESTs are excluded.
    validate: [
      {
        operations: [CREATE, UPDATE, DELETE]
        where: {
          node: {
            fieldContext_SOME: {
              OR: [
                { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  weSpace_SOME: {
                    members_SOME: {
                      AND: [
                        { member_SOME: { id_EQ: "$jwt.user.id" } }
                        { role_IN: [ADMIN, MEMBER] }
                      ]
                    }
                  }
                }
              ]
            }
          }
        }
      }
    ]
  ) {
  id: ID! @id
  filename: String!
  mimeType: String!
  sizeBytes: Int!
  """Page count for paginated formats (.pdf). 1 for .txt/.md. Null when unknown (legacy uploads)."""
  pageCount: Int
  """Blob storage key. Internal — UI surfaces filename instead. Never exposed
  to any client: `@selectable(onRead: false)` removes it from read selection
  sets and `@filterable(byValue: false)` blocks value inference via filters
  (GOAL-302). The download route reads it server-side over raw Cypher, so the
  file stays reachable to members through the opaque `downloadUrl` only."""
  blobKey: String
    @selectable(onRead: false, onAggregate: false)
    @filterable(byValue: false, byAggregate: false)
  """Provider-issued URL for the blob. May be expiring/private — never returned
  to a client (GOAL-302); members open the file through `downloadUrl`. Same
  non-selectable / non-filterable gate as `blobKey`."""
  blobUrl: String
    @selectable(onRead: false, onAggregate: false)
    @filterable(byValue: false, byAggregate: false)
  """Durable, Space-scoped in-app link to open/download the uploaded file
  (GOAL-283). Stable per document — resolves through
  GET /api/ingest/document/<id>/download, which re-checks Space read access and
  mints a fresh presigned S3 URL on every hit. This is the permanent handle to
  the file; unlike blobUrl it never expires and is safe to share within the
  Space. Computed from the document id (see documentTypeResolvers.downloadUrl)."""
  downloadUrl: String @customResolver(requires: "id")
  """Optional one-line "What is this?" hint captured at upload. Reused on re-extract (slice 6)."""
  userHint: String
  """Public link this document was fetched from, when it was not uploaded by a
  member but read server-side by the bulk article import (GOAL-344). Null for
  uploads. Read-only: the worker stamps it at anchor time."""
  sourceUrl: String @settable(onCreate: false, onUpdate: false)
  """AI-generated 1-paragraph synopsis of the document content. Produced at
  ingest time by a dedicated summarization call (independent of the entity
  extraction model). Null if the call failed or was skipped — document still
  lands either way (failure is non-fatal). Refreshed on re-extract."""
  summary: String
  """Up to ~5 short concept phrases the AI surfaced as the document's
  high-level themes. Rendered as chips on the Document card so the user can
  see what the doc is *about* before scanning extracted entities. Empty when
  the summarizer returned nothing or the call failed."""
  concepts: [String!]
  """Ingest lifecycle (GOAL-292): PENDING → PROCESSING → COMPLETE / FAILED.
  The upload route anchors PENDING and returns 202; the
  /api/cron/process-document-ingestion worker transitions the rest. The upload
  UI polls this to show queued/processing/failed instead of blocking on a
  synchronous response. Documents uploaded before GOAL-292 have no stored value
  and read back as COMPLETE, so an old upload never looks stuck."""
  status: String @settable(onCreate: false, onUpdate: false)
  """Member-safe explanation when `status` is FAILED — safe to render verbatim
  (kb/07 Rule 1: raw driver/model error text is logged server-side only). Null
  in every other state. The file and its Document row both survive a failure,
  so Re-extract stays the recovery path."""
  statusMessage: String @settable(onCreate: false, onUpdate: false)
  """Entities the ingest run wrote into the graph. Populated when `status`
  reaches COMPLETE; the upload UI reports it in the success toast."""
  ingestCreatedEntityCount: Int @settable(onCreate: false, onUpdate: false)
  """Proposed entities whose write failed during the ingest run — partial
  success is normal and is detailed in the ingest thread."""
  ingestFailedEntityCount: Int @settable(onCreate: false, onUpdate: false)
  uploadedAt: DateTime!
  fieldContext: [FieldContext!]! @relationship(type: "HAS_DOCUMENT", direction: IN)
  uploadedBy: [Person!]! @relationship(type: "UPLOADED_BY", direction: OUT)
  """People extracted from this document (provenance — see EXTRACTED_FROM)."""
  extractedPeople: [Person!]!
    @relationship(type: "EXTRACTED_FROM", direction: IN)
  """FieldPulses extracted from this document (provenance — see EXTRACTED_FROM)."""
  extractedPulses: [FieldPulse!]!
    @relationship(type: "EXTRACTED_FROM", direction: IN)
  """Ingest threads spawned from this document — initial upload + every Re-extract attempt. Ordered newest first."""
  ingestThreads: [DocumentIngestThread!]!
    @cypher(
      statement: """
      MATCH (this)-[:HAS_INGEST_THREAD]->(t:ConversationThread)
      // coalesce: DocumentIngestThread.title is String!, so a null title would
      // error the whole field. The hand-rolled resolver twin already does this.
      RETURN {id: t.id, title: coalesce(t.title, ''), createdAt: toString(t.createdAt)} AS thread
      ORDER BY t.createdAt DESC
      """
      columnName: "thread"
    )
}

"""
Lightweight projection of a ConversationThread spawned by document ingestion.
We deliberately do not surface the underlying ConversationThread node as a
GraphQL type — its lifecycle is owned by the assistant subsystem, not the
graph schema.
"""
type DocumentIngestThread {
  id: ID!
  title: String!
  createdAt: String!
}

"""
Response payload for `reExtractDocument`. (The initial-upload mutation has
been replaced by the REST direct-to-S3 flow; see
`POST /api/ingest/document/presign` + `/process`.)
"""
type IngestDocumentResponse {
  documentId: ID!
  threadId: ID!
  """Number of entities (Persons + FieldPulses) the extractor proposed AND
  the server auto-executed against the graph. Equivalent to the count of
  successful tool calls in the synthesized assistant turn.
  See PRD § revised flow — uploads no longer wait on HITL approval."""
  createdEntityCount: Int!
  """Number of proposed entities whose auto-execution failed (validation,
  permission, or runtime errors). Surfaced in the ingest thread per
  call. Zero on the happy path."""
  failedEntityCount: Int!
}

"""Response payload for `deleteDocument`. The Document node and its blob are
removed; previously extracted Persons and FieldPulses are untouched (their
EXTRACTED_FROM edges drop with the Document)."""
type DeleteDocumentResponse {
  documentId: ID!
  deleted: Boolean!
}

"""Response payload for `deleteFieldContext` (GOAL-319). The context, its
sub-context subtree (GOAL-295), and their pulses are soft deleted in one
transaction — immediately hidden from every read surface — and hard-purged
with all nested content by the daily purge cron once the 90-day retention
window passes."""
type DeleteFieldContextResponse {
  contextId: ID!
  deleted: Boolean!
  """Number of pulses soft-deleted along with the context."""
  deletedPulseCount: Int!
  """Number of nested sub-contexts soft-deleted along with the context (GOAL-295)."""
  deletedSubContextCount: Int!
}

"""Response payload for `createSubFieldContext` (GOAL-295). Pure payload —
the query/mutation exclusions stop the library from generating CRUD roots
for it (an authenticated user could otherwise create junk nodes with this
label; the older response types share that gap — swept under GOAL-330)."""
type CreateSubFieldContextResponse
  @query(read: false, aggregate: false)
  @mutation(operations: []) {
  contextId: ID!
  title: String!
  parentContextId: ID!
}

"""Response payload for `moveFieldContext` (GOAL-295). `newParentContextId`
is null when the context was moved to the top level of its Space. Pure
payload — CRUD roots excluded (see CreateSubFieldContextResponse)."""
type MoveFieldContextResponse
  @query(read: false, aggregate: false)
  @mutation(operations: []) {
  contextId: ID!
  newParentContextId: ID
  moved: Boolean!
}

# ============================================================================
# PULSES (First-Class Citizens - The Write Path)
# ============================================================================

"""
Base pulse type.
Represents a single contributed unit of meaning.
Authorization: Only accessible by users with access to the parent FieldContext's Space.
Never instantiate directly - use concrete types (GoalPulse, ResourcePulse, StoryPulse).
"""
interface FieldPulse {
  id: ID!
  title: String!
  content: String!
  createdAt: DateTime!
  intensity: Float
  createdBy: [Person!]! @declareRelationship
  """
  Canonical author edge, `(:FieldPulse)-[:INITIATED_BY]->(:Person)`,
  written by the assistant + doc-ingest paths (`lib/chat/hitl.ts`,
  `api/pulse/create-from-conversation`) — doc-ingested pulses point at
  the extracted author. `createdBy` carries the same meaning but is
  written by the dashboard create flow and the CSV/document imports, so
  NEITHER field alone covers all pulses: consumers must read both,
  preferring `initiatedBy` (see `resolvePulseAuthor` in
  `src/lib/pulse-author.ts`) or matching the Cypher alternation
  `[:INITIATED_BY|CREATED_BY]`.
  """
  initiatedBy: [Person!]! @declareRelationship
  context: [FieldContext!]! @declareRelationship
  """
  Documents this pulse was extracted from (doc-ingestion provenance — see GOAL-242 + ADR-0002).
  Empty for manually-created pulses. Returned newest-uploaded first.
  """
  extractedFrom: [Document!]! @declareRelationship
}

"""
A pulse that functions as a goal in its context.
Multi-label: ["FieldPulse", "GoalPulse"]
Merged properties from legacy Goal entity.
"""
type GoalPulse implements FieldPulse
  @node(labels: ["FieldPulse", "GoalPulse"])
  @authorization(
    # READ — inherits from the parent FieldContext / Space.
    filter: [
      {
        where: {
          node: {
            context_SOME: {
              OR: [
                { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  meSpace_SOME: {
                    members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                  }
                }
                { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  weSpace_SOME: {
                    members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                  }
                }
              ]
            }
          }
        }
      }
    ]
    # WRITE — split per kb/02-user-roles.md operation matrix:
    #   CREATE/UPDATE → owner, ADMIN, or MEMBER on the owning space
    #   DELETE        → creator, owner, or ADMIN
    validate: [
      {
        operations: [CREATE, UPDATE]
        where: {
          node: {
            context_SOME: {
              OR: [
                { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  weSpace_SOME: {
                    members_SOME: {
                      AND: [
                        { member_SOME: { id_EQ: "$jwt.user.id" } }
                        { role_IN: [ADMIN, MEMBER] }
                      ]
                    }
                  }
                }
              ]
            }
          }
        }
      }
      {
        operations: [DELETE]
        where: {
          node: {
            OR: [
              # Creator self-delete (kb/02 matrix) must accept BOTH live
              # author edges: createdBy (dashboard flow, imports) and
              # initiatedBy (assistant + doc-ingest paths) — either alone
              # strands the other surface's creators.
              { createdBy_SOME: { id_EQ: "$jwt.user.id" } }
              { initiatedBy_SOME: { id_EQ: "$jwt.user.id" } }
              {
                context_SOME: {
                  OR: [
                    { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                    { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                    {
                      weSpace_SOME: {
                        members_SOME: {
                          AND: [
                            { member_SOME: { id_EQ: "$jwt.user.id" } }
                            { role_EQ: ADMIN }
                          ]
                        }
                      }
                    }
                  ]
                }
              }
            ]
          }
        }
      }
    ]
  ) {
  id: ID! @id
  title: String!  # Mapped from legacy Goal.name
  content: String!  # Mapped from legacy Goal.description
  createdAt: DateTime!
  intensity: Float
  
  # Modern goal properties
  status: GoalStatus!
  horizon: GoalHorizon
  
  # Merged legacy Goal properties
  successMeasures: String
  photo: String
  activities: String
  type: String
  why: String
  location: String
  time: String
  
  createdBy: [Person!]! @relationship(type: "CREATED_BY", direction: OUT)
  initiatedBy: [Person!]! @relationship(type: "INITIATED_BY", direction: OUT)
  context: [FieldContext!]! @relationship(type: "HAS_PULSE", direction: IN)
  extractedFrom: [Document!]! @relationship(type: "EXTRACTED_FROM", direction: OUT)
}

"""
A pulse that functions as a resource in its context.
Multi-label: ["FieldPulse", "ResourcePulse"]
Merged properties from legacy Resource entity.
"""
type ResourcePulse implements FieldPulse
  @node(labels: ["FieldPulse", "ResourcePulse"])
  @authorization(
    # READ — inherits from the parent FieldContext / Space.
    filter: [
      {
        where: {
          node: {
            context_SOME: {
