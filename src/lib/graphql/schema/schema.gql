type Mutation {
  """
  Send a message to the chatbot and receive a response.
  """
  sendMessageToChatbot(message: String!, sessionId: String): ChatbotResponse

  """
  Create or update a direct person-to-person connection.
  Persists a CONNECTED_TO relationship with optional why/interests metadata.
  """
  createPersonConnection(
    fromPersonId: ID!
    toPersonId: ID!
    why: String
    interests: String
  ): CreatePersonConnectionResponse!

  """
  Update an existing person-to-person connection.
  Updates the why and interests metadata for a CONNECTED_TO relationship.
  """
  updatePersonConnection(
    fromPersonId: ID!
    toPersonId: ID!
    why: String
    interests: String
  ): UpdatePersonConnectionResponse!

  """
  Delete a person-to-person connection.
  Removes the CONNECTED_TO relationship between two people.
  """
  deletePersonConnection(
    fromPersonId: ID!
    toPersonId: ID!
  ): DeletePersonConnectionResponse!

  """
  Edit a PersonPulse (a non-user :Person:PersonPulse) — its identity, its
  relational `description` note, and the caller's relationship to it.

  Authorization (enforced server-side, NOT via @authorization since this is a
  custom resolver): the target must NOT carry the User label, and the caller
  must own or be a member of a Space that has a FieldContext attached to this
  person. This is the same reach used by the assistant's create_person, so
  create and edit are symmetric. Editing a real User's node is rejected — that
  flows through the self-gated updatePeople instead.

  Only non-null arguments are applied. `relationshipWhy` MERGEs/updates a
  CONNECTED_TO edge from the caller to the person (empty string clears the why).
  """
  updatePersonPulse(
    personId: ID!
    firstName: String
    lastName: String
    description: String
    relationshipWhy: String
  ): UpdatePersonPulseResponse!

  """
  Attach an existing person to a field context (HAS_PERSON). This is the ONLY
  write path for HAS_PERSON through GraphQL — the nested CONNECT on
  FieldContext.people / Person.contexts is disabled.

  Authorization (enforced server-side in the resolver, not via @authorization):
  the caller must be able to edit the context (owner, ADMIN, or MEMBER of its
  parent Space — GUESTs are view-only), and a target carrying the `User` label
  may only be attached when they are the caller themselves or already own / are
  a member of that parent Space. Attaching a person unlocks their gated PII to
  the space's members (Person contexts_SOME READ branch), so for registered
  accounts, presence in the Space is the consent boundary. Non-user people
  (PersonPulse / imported contacts) are space content and attachable by any
  editor. Writes an activity Log.
  """
  addPersonToFieldContext(
    contextId: ID!
    personId: ID!
  ): AddPersonToFieldContextResponse!

  """
  Add a member to a space with a specific role.
  Only the space owner or members with ADMIN role can add new members.
  """
  addSpaceMember(
    spaceId: ID!
    memberId: ID!
    role: SpaceRole!
  ): AddSpaceMemberResponse!

  """
  Invite someone to a space by email address, even if they are not yet a
  GoalPost member. If no Person with that email exists, a placeholder Person
  is created and a single-use invite email is sent so they can set a password
  and join. If the email already belongs to a Person/User, they are added like
  addSpaceMember. Only the space owner or members with ADMIN role can invite.
  """
  inviteToSpaceByEmail(
    spaceId: ID!
    email: String!
    role: SpaceRole!
  ): AddSpaceMemberResponse!

  """
  Update a space member's role.
  Only the space owner or members with ADMIN role can change roles.
  """
  updateSpaceMemberRole(
    spaceId: ID!
    memberId: ID!
    role: SpaceRole!
  ): UpdateSpaceMemberRoleResponse!

  """
  Remove a member from a space.
  Only the space owner or members with ADMIN role can remove members.
  Cannot remove the space owner.
  """
  removeSpaceMember(spaceId: ID!, memberId: ID!): RemoveSpaceMemberResponse!

  """
  Update AI functionality preferences for a user.
  Users can enable or disable AI features in the application.
  """
  updateUserAI(userId: ID!, aiEnabled: Boolean!): UpdateUserAIResponse!
  
  """
  Generate embeddings for a person's profile.
  Legacy mutation preserved for compatibility.
  """
  generatePersonEmbeddings(personId: ID!): Boolean!
  
  # ============================================================================
  # ACTIVITY LOGGING MUTATIONS
  # ============================================================================
  
  """
  Log a pulse-related activity (create, update, delete).
  Automatically creates a Log node with CREATED_BY relationship to the current user
  and LOGGED_FOR relationship to the pulse.
  
  Example:
    mutation {
      logPulseActivity(input: {
        action: "created"
        pulseId: "pulse_123"
        pulseType: "GoalPulse"
        pulseName: "Launch MVP"
        contextId: "context_456"
      }) {
        success
        message
        log { id description createdAt }
      }
    }
  """
  logPulseActivity(input: LogPulseInput!): CreateLogResponse!
  
  """
  Log a space-related activity (create, update, delete).
  Creates a Log node with description and metadata about the space operation.
  """
  logSpaceActivity(input: LogSpaceInput!): CreateLogResponse!
  
  """
  Log a member-related activity (added, removed, role-changed).
  Captures membership changes in spaces with role information.
  """
  logMemberActivity(input: LogMemberInput!): CreateLogResponse!
  
  """
  Log a field context-related activity (create, update, delete).
  Tracks field context operations within spaces.
  """
  logFieldActivity(input: LogFieldInput!): CreateLogResponse!
  
  """
  Log a resonance-related activity (created, updated, deleted).
  Tracks AI-discovered or user-created resonance links between pulses.
  """
  logResonanceActivity(input: LogResonanceInput!): CreateLogResponse!

  """
  Log a promise-weave activity (created, updated, confirmed, dissolved,
  fulfilled, deleted). Covers the runtime authoring path; migration-built
  weaves are Log-exempt like the other structural builds.
  """
  logWeaveActivity(input: LogWeaveInput!): CreateLogResponse!

  # ============================================================================
  # DOC INGESTION MUTATIONS (see GOAL-235)
  # ============================================================================
  #
  # Initial upload is REST-only: the browser uploads directly to S3 via a
  # presigned PUT URL minted by POST /api/ingest/document/presign, then
  # triggers extraction via POST /api/ingest/document/process. The file
  # bytes never traverse this server.

  """
  Re-run the extraction model against an existing Document (slice 6 of
  GOAL-235). The original blob is reused; no new blob is written, no new
  Document node is created. A fresh ConversationThread titled
  `Ingest: <filename> (re-extracted)` is created and linked back to the
  Document via HAS_INGEST_THREAD so the Document detail view can list every
  attempt.

  Caller must hold canEditContent on the FieldContext's parent Space.
  Previously approved entities are untouched — re-extract only proposes
  new tool calls.
  """
  reExtractDocument(documentId: ID!): IngestDocumentResponse!

  """
  Delete a Document and its backing blob. Caller must hold canEditContent
  on the FieldContext's parent Space.

  Previously extracted entities (Persons, FieldPulses) survive — their
  EXTRACTED_FROM edges drop with the Document but the entities remain in
  the graph as user data (see PRD § Out of Scope — Documents never cascade
  to their extractions).
  """
  deleteDocument(documentId: ID!): DeleteDocumentResponse!

  """
  Delete a FieldContext and everything nested under it (GOAL-319). The
  context, its sub-context subtree (GOAL-295), and their pulses are SOFT
  deleted in a single transaction: stamped with deletedAt and detached from
  their Space (each HAS_CONTEXT edge is re-pointed to HAS_DELETED_CONTEXT),
  which hides the whole subtree from every read surface at once. The daily
  purge cron hard-deletes the contexts and all nested entities (pulses,
  chunks, resonance links, suggestions, weaves, documents + blobs, orphaned
  organizations) after 90 days.

  Authorization (enforced server-side in the resolver, matching the
  kb/02-user-roles.md DELETE matrix): Space owner or ADMIN only. The
  generated deleteFieldContexts mutation is disabled — it deleted the bare
  context node and orphaned all nested content.
  """
  deleteFieldContext(contextId: ID!): DeleteFieldContextResponse!

  """
  Create a sub-context nested under an existing FieldContext (GOAL-295).
  The child is created in the SAME Space as the parent — it gets its own
  HAS_CONTEXT edge, so every auth / soft-delete / discovery surface keeps
  working unchanged — plus the HAS_SUBCONTEXT overlay edge from the parent.
  Nesting is capped at depth 5 (a root context sits at depth 0).

  Authorization (enforced server-side in the resolver): canEditContent on
  the parent Space — owner, ADMIN, or MEMBER (kb/02-user-roles.md). Writes
  an activity Log in the same transaction.
  """
  createSubFieldContext(
    parentContextId: ID!
    title: String!
    emergentName: String
  ): CreateSubFieldContextResponse!

  """
  Move a FieldContext under a new parent context, or to the top level of
  its Space when newParentContextId is null (GOAL-295). The context keeps
  its Space HAS_CONTEXT edge — only the HAS_SUBCONTEXT overlay changes.
  The target parent must live in the same Space; moves that would create a
  cycle (self / own descendant) or push the subtree past the depth cap (5)
  are rejected.

  Authorization (enforced server-side in the resolver): canEditContent on
  the Space — owner, ADMIN, or MEMBER. Writes an activity Log in the same
  transaction.
  """
  moveFieldContext(
    contextId: ID!
    newParentContextId: ID
  ): MoveFieldContextResponse!
}

# ============================================================================
# AI ASSISTANT FEEDBACK (Self-Improvement Loop)
# ============================================================================

"""
How the user rated an assistant response, or — for auto-detected signals —
whether the system considers the response acceptable.
"""
enum AssistantFeedbackRating {
  POSITIVE
  NEGATIVE
}

"""
Response shape for submitAssistantFeedback. Returns a sparse envelope —
the dev dashboard reads detail directly from Neo4j; the chat UI only
needs success confirmation.
"""
type SubmitAssistantFeedbackResponse {
  success: Boolean!
  message: String!
  feedbackId: ID
}

extend type Mutation {
  """
  Persist a user-driven rating on a single assistant turn.

  Authorization:
    - The submitting user MUST own the ConversationThread containing the
      turn (enforced server-side; mismatch returns success:false).

  Inputs:
    - turnId:      the `ConversationTurn.id` exposed to the UI via the
                    AI SDK message metadata stream.
    - rating:      POSITIVE for thumbs-up, NEGATIVE for thumbs-down.
    - userComment: optional "what would have been better" text shown to
                    devs in the /dev/ai-quality triage dashboard.

  Auto-detected signals (tool errors, empty responses, Rule-1 leaks)
  flow through a separate server-side write path — not this mutation.
  """
  submitAssistantFeedback(
    turnId: ID!
    rating: AssistantFeedbackRating!
    userComment: String
  ): SubmitAssistantFeedbackResponse!

  """
  Mark a single notification read. No-op if already read or not owned by the
  caller. Recipient-scoped: only the notification's recipient may mark it (the
  resolver re-checks the JWT user id, and the recipient MATCH is the auth gate).
  Does NOT write to the activity Log stream. Returns the caller's fresh unread
  count.
  """
  markNotificationRead(id: ID!): MarkNotificationResponse!

  """
  Mark all of the current user's notifications read. Recipient-scoped via the
  JWT user id. Returns the new unread count (0).
  """
  markAllNotificationsRead: MarkNotificationResponse!
}

"""
Result of a mark-read mutation, carrying the caller's refreshed unread count so
the bell badge can update without a second round-trip.
"""
type MarkNotificationResponse {
  success: Boolean!
  message: String!
  unreadCount: Int!
}

# ============================================================================
# QUERIES
# ============================================================================

type Query {
  """
  Global federated search across all entity types.
  Searches using case-insensitive substring matching on:
    - Pulses: content field
    - People: full name ("firstName lastName" concatenation) — name only,
      never email/PII (GOAL-275), and only directory-safe fields are returned
    - Contexts: title field
    - Spaces (MeSpace/WeSpace): name field (filtered by user ownership/membership)

  Space Filtering:
    - Only returns spaces where the current user is the owner OR a member with any role (ADMIN, MEMBER, or GUEST)
    - Private spaces not owned or joined by the user are excluded from results

  Args:
    - query: Search term (required, case-insensitive substring match)

  Returns: SearchResults with up to 10 results of each entity type
  """
  searchAll(query: String!): SearchResults
  
  """
  Find a user by email address for member addition.
  Bypasses authorization restrictions to allow space owners to add any registered user.
  Returns null if no user found with the given email.
  
  Args:
    - email: Email address to search for (case-sensitive exact match)
    
  Returns: User object or null
  """
  findUserByEmail(email: String!): User
  
  """
  Returns people related to the current user.
  For use in dashboard - shows only people connected through spaces or direct connections.
  
  Includes:
    - The current user themselves
    - People who own spaces where current user is owner or member
    - People who are members of spaces where current user is owner or member
    - Direct connections to the current user
    
  Returns: Array of Person objects
  """
  relatedPeople: [Person!]!
  
  # ============================================================================
  # LEGACY SUBSTRING QUERIES (Preserved for backward compatibility)
  # ============================================================================
  
  # GOAL-275: `peopleSubstringSearch` was removed. It was a root @cypher query
  # returning full :Person nodes (`RETURN person`) with NO @authorization and no
  # lean projection — i.e. an unauthenticated-by-Space PII surface of the exact
  # class this ticket closes, and with NO parent-node gate to fall back on. It
  # had zero consumers (search goes through `searchAll`, which is lean-projected
  # server-side). Removed outright rather than gated, so its PII safety does not
  # depend on whether field-level @authorization reaches @cypher-materialized
  # nodes. If people-substring search is ever reinstated, project only
  # id/firstName/lastName/photo (see `searchAll` in search-resolver.ts).

  """
  Search for goals by substring match on title or content.
  LEGACY: Consider using searchAll for unified search experience.
  """
  goalSubstringSearch(key: String!): [GoalPulse!]!
    @cypher(
      statement: """
      MATCH (goal:GoalPulse)
      WHERE toLower(goal.title) CONTAINS toLower($key)
        OR toLower(goal.content) CONTAINS toLower($key)
      RETURN goal
      """
      columnName: "goal"
    )
  
  """
  Search for resources by substring match on title or content.
  LEGACY: Consider using searchAll for unified search experience.
  """
  resourceSubstringSearch(key: String!): [ResourcePulse!]!
    @cypher(
      statement: """
      MATCH (resource:ResourcePulse)
      WHERE toLower(resource.title) CONTAINS toLower($key)
        OR toLower(resource.content) CONTAINS toLower($key)
      RETURN resource
      """
      columnName: "resource"
    )
  
  """
  Search for story pulses by substring match on title or content.
  LEGACY: Consider using searchAll for unified search experience.
  """
  storyPulseSubstringSearch(key: String!): [StoryPulse!]!
    @cypher(
      statement: """
      MATCH (story:StoryPulse)
      WHERE toLower(story.title) CONTAINS toLower($key)
        OR toLower(story.content) CONTAINS toLower($key)
      RETURN story
      """
      columnName: "story"
    )

  # Retired (GOAL-307): carePointSubstringSearch + coreValueSubstringSearch.
  # Both matched (x:StoryPulse) filtered by legacy CarePoint/CoreValue optional
  # fields. Since GOAL-287 migrated core values are :CoreValuePulse and migrated
  # care points are :PromiseWeave, so both queries returned empty for every real
  # row. No live callers (LEGACY, superseded by searchAll, which covers core
  # values via its coreValuePulses branch). Removed rather than retargeted to
  # shrink the @cypher surface.

  # ============================================================================
  # ACTIVITY LOGS & NOTIFICATIONS
  # ============================================================================
  
  # ============================================================================
  # DOC INGESTION QUERIES (see GOAL-235)
  # ============================================================================

  """
  List all documents attached to a FieldContext, newest first. Returns an
  empty array if the caller cannot view the parent Space.
  """
  documentsByFieldContext(fieldContextId: ID!): [Document!]!

  """
  Get activity logs for a specific context (shows what happened in a space/field).
  Returns up to N most recent log entries linked to pulses in this context.
  
  Args:
    - contextId: The FieldContext ID to fetch logs for
    - limit: Maximum number of logs to return (default: 20)
  
  Returns: Array of Log objects with creator information
  """
  getContextLogs(contextId: ID!, limit: Int = 20): [Log!]!
  
  """
  Get activity logs for a specific user (shows the user's activity history).
  Returns up to N most recent log entries created by this user.
  
  Args:
    - userId: The Person ID to fetch logs for
    - limit: Maximum number of logs to return (default: 50)
  
  Returns: Array of Log objects with creator information
  """
  getUserLogs(userId: ID!, limit: Int = 50): [Log!]!
  
  """
  Get recent logs for spaces owned or joined by the current user.
  Used for the notification/activity feed in dashboard sidebars.
  
  Args:
    - limit: Maximum number of logs to return (default: 30)
  
  Returns: Array of Log objects, sorted by recency
  """
  getMyRecentLogs(limit: Int = 30): [Log!]!

  """
  The current user's notifications, newest first. Recipient-scoped via the JWT
  user id inside the resolver — the client never builds a recipient filter.
  Backs the bell popover (distinct from the getMy*Logs audit queries above).

  Args:
    - limit: Maximum number of notifications to return (default: 20, max 100)
  """
  myNotifications(limit: Int = 20): [Notification!]!

  """
  Count of the current user's unread notifications. Recipient-scoped via the
  JWT user id (Cypher count, coerced with Number()). Backs the bell badge.
  """
  unreadNotificationCount: Int!
}
