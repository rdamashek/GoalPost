"""
A discovered semantic resonance link between two pulses within the same FieldContext.
Represents an AI-identified connection with confidence scoring.
Scoped to a single FieldContext - only pulses in the same context can resonate.
Multi-label: ["ResonanceLink"]

MIGRATION PATTERN:
- ResonanceLink.label should be set to the legacy relationship type name
- Legacy relationship types to preserve as labels:
  - MOTIVATED_BY (Person/Community → Goal)
  - APPLIED_TO (Goal ← Resource)
  - ALIGNED_TO (Goal → CoreValue)
  - ENABLES (Goal → CarePoint)
  - CARES_FOR (Goal ← CarePoint)
  - DEPENDS_ON (CarePoint → Resource)
  - EMBRACES (Person/Community → CoreValue)
  - PROVIDES (Person/Community → Resource)
  - HAS_ACCESS_TO (Community → Resource)
  - CONNECTED_TO (Person → Person, with why/interests in evidence)

Example:
  Legacy: Goal "Launch App" -[:APPLIED_TO]-> Resource "Developer Time"
  Migrated: GoalPulse "Launch App" <-[:SOURCE]- ResonanceLink {label: "APPLIED_TO"} -[:TARGET]-> ResourcePulse "Developer Time"
"""
type ResonanceLink
  @node(labels: ["ResonanceLink"])
  @authorization(
    # READ — anyone who can see the parent FieldContext (owner or any
    # member of the owning Me/We space) can see the resonance.
    filter: [
      {
        where: {
          node: {
            context_SOME: {
              OR: [
                { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  meSpace_SOME: {
                    members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                  }
                }
                { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  weSpace_SOME: {
                    members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                  }
                }
              ]
            }
          }
        }
      }
    ]
    # WRITE — CREATE/UPDATE/DELETE require OWNER, ADMIN, or MEMBER on
    # the owning Me/We space. GUESTs are excluded (kb/02-user-roles.md).
    validate: [
      {
        operations: [CREATE, UPDATE, DELETE]
        where: {
          node: {
            context_SOME: {
              OR: [
                { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  weSpace_SOME: {
                    members_SOME: {
                      AND: [
                        { member_SOME: { id_EQ: "$jwt.user.id" } }
                        { role_IN: [ADMIN, MEMBER] }
                      ]
                    }
                  }
                }
              ]
            }
          }
        }
      }
    ]
  ) {
  id: ID! @id
  label: String!
  description: String
  confidence: Float
  evidence: String
  mergedFrom: String
  createdAt: DateTime!
  source: [FieldPulse!]! @relationship(type: "SOURCE", direction: OUT)
  target: [FieldPulse!]! @relationship(type: "TARGET", direction: OUT)
  context: [FieldContext!]! @relationship(type: "HAS_RESONANCE", direction: IN)
}

"""
A connective container that gives a pulse (initially a migrated CarePoint) a
navigable neighbourhood. It holds the relationships between a care point and the
people and field it implicates, so "show surrounding relationships" returns a
starting point rather than a dead end.

Modelled as a reified connector node, mirroring ResonanceLink: it is its own
node type (NOT a pulse subtype) and is surfaced within a FieldContext via a
HAS_WEAVE context edge — directly analogous to how ResonanceLink is surfaced via
HAS_RESONANCE, so it slots into the same Space-scoped authorization and Bloom
scoping. Originates in Steve's relational "map" (see
docs/promise-weave-design-spike.md, GOAL-266).

Authoring: three origins now write weaves — the prod→dev migration (which wraps
each migrated care point), a member authoring one from a FieldContext, and AI
discovery. AI-discovered weaves land `proposed` and only become `active` once a
member confirms them; see `status` below and kb/04-state-machines.md.

Multi-label: ["PromiseWeave"]
"""
type PromiseWeave
  @node(labels: ["PromiseWeave"])
  # Writes opened for member authoring + the AI-discovery HITL gate (spike §6.5).
  # The @authorization validate rules below gate every one of them to OWNER /
  # ADMIN / MEMBER on the owning Me/We space.
  @mutation(operations: [CREATE, UPDATE, DELETE])
  @authorization(
    # READ — anyone who can see the parent FieldContext (owner or any
    # member of the owning Me/We space) can see the weave. Mirrors ResonanceLink.
    filter: [
      {
        where: {
          node: {
            context_SOME: {
              OR: [
                { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  meSpace_SOME: {
                    members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                  }
                }
                { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  weSpace_SOME: {
                    members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                  }
                }
              ]
            }
          }
        }
      }
    ]
    # WRITE — CREATE/UPDATE/DELETE require OWNER, ADMIN, or MEMBER on
    # the owning Me/We space. GUESTs are excluded (kb/02-user-roles.md).
    #
    # The FIRST rule pins authorship at creation: `createdBy` is a plain
    # nested CONNECT, so without it any MEMBER could point the edge at the
    # Space owner and the entity-info drawer would render "Woven by <owner>"
    # — forged authorship on a trusted surface (GOAL-341 review).
    #
    # Scoped to CREATE rather than CREATE_RELATIONSHIP on purpose: a
    # relationship-level rule also fires when a DIFFERENT member later edits
    # the weave's woven pulses, which would wrongly forbid one member from
    # editing another's weave. It cannot live on the `createdBy` field either
    # — the library rejects @authorization alongside @relationship.
    # `_SINGLE` rather than `_SOME` so a forged second edge cannot ride
    # along beside the honest one.
    #
    # NOTE for GOAL-342: an AI-proposed weave has no member author, so the
    # discovery path must write its node server-side (raw Cypher, as the
    # migration does) rather than through this mutation.
    validate: [
      {
        operations: [CREATE]
        where: { node: { createdBy_SINGLE: { id_EQ: "$jwt.user.id" } } }
      }
      {
        operations: [CREATE, UPDATE, DELETE]
        where: {
          node: {
            context_SOME: {
              OR: [
                { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  weSpace_SOME: {
                    members_SOME: {
                      AND: [
                        { member_SOME: { id_EQ: "$jwt.user.id" } }
                        { role_IN: [ADMIN, MEMBER] }
                      ]
                    }
                  }
                }
              ]
            }
          }
        }
      }
    ]
  ) {
  id: ID! @id
  title: String
  """
  Why these things are woven together — a member's note, or the evidence AI
  discovery cited when it proposed the weave.
  """
  description: String
  """
  Lifecycle state, stored lowercase to match ResonanceLink's `status`:
  `proposed` | `active` | `fulfilled` | `dissolved`. See
  kb/04-state-machines.md. Null on the migration-built starting-point weaves
  that predate the lifecycle — readers treat null as `active`.
  """
  status: String
  """
  Who authored the weave: `user` (a member, via the field context) or `ai`
  (discovery, awaiting confirmation). Null means migration-built.
  """
  origin: String
  createdAt: DateTime!
  modifiedAt: DateTime
  # Nested write operations are ENUMERATED on every edge below, never left
  # open. Opening the root mutations (see @mutation above) also opens every
  # nested input the library generates from these relationships — including
  # `delete`, which cascades a bare DETACH DELETE into the connected node.
  weaves: [FieldPulse!]!
    @relationship(
      type: "WEAVES"
      direction: OUT
      nestedOperations: [CONNECT, DISCONNECT]
    )
  wovenFor: [Person!]!
    @relationship(
      type: "WOVEN_FOR"
      direction: OUT
      nestedOperations: [CONNECT, DISCONNECT]
    )
  """
  The member who authored the weave. CONNECT-only, and the validate rule below
  pins the connected Person to the caller. Without it any MEMBER could point
  this edge at the Space owner, and the entity-info drawer renders it verbatim
  as "Woven by <name>" — forged authorship, straight onto a trusted surface.
  `_SINGLE` rather than `_SOME` so a second, forged edge cannot ride along
  beside the honest one.
  """
  createdBy: [Person!]!
    @relationship(
      type: "CREATED_BY"
      direction: OUT
      nestedOperations: [CONNECT]
    )
  """
  The FieldContext this weave hangs off — the visibility anchor that EVERY
  @authorization rule on this type traverses (`context_SOME`).

  CONNECT-only, for two independent reasons:

  - `delete` here cascaded into the parent FieldContext, stranding every pulse
    in that field with no HAS_PULSE anchor and no `deletedAt` stamp: invisible
    to every read, undeletable, and never collected by the 90-day purge cron.
    That is what GOAL-319 removed `deleteFieldContexts` to prevent.
  - `disconnect` is NOT covered by the type-level validate block below, which
    enumerates CREATE/UPDATE/DELETE and so never sees DELETE_RELATIONSHIP.
    Only the READ filter applied, and it admits any member — so a MEMBER could
    sever this edge and leave the weave unreadable, unwritable and undeletable
    by everyone including its own author. A permanent ghost.

  Root `deletePromiseWeaves(where:)` still removes the edge along with the
  node, so ordinary deletion is unaffected.
  """
  context: [FieldContext!]!
    @relationship(
      type: "HAS_WEAVE"
      direction: IN
      nestedOperations: [CONNECT]
    )
}

"""
An organization, group, company, cooperative or institution named in an
uploaded document (GOAL-298). Captured as a first-class relational entity so
members can discover it and connect to the resources/stories it belongs to.
Multi-label at the node level: ["Organization", "LifeSensor", "RelationalEntity"]
— the GraphQL type maps the load-bearing "Organization" label; the ontology
labels ride alongside (parity with migrated Persons).

Writes are server-side ONLY (doc-ingestion via `executeAuthorizedWriteTool` in
`lib/chat/hitl.ts`) — every generated mutation is disabled, so an Organization
can only be minted / attached through the audited ingest path that already
gates on `canEditContent`.
"""
type Organization
  @node(labels: ["Organization"])
  @mutation(operations: [])
  @authorization(
    # READ — anyone who can see a FieldContext the organization is attached to
    # (owner or any member of that context's owning Me/We space) can see it.
    # This is the ONLY Space tie an Organization has — like a :PersonPulse it
    # owns no Space and holds no membership — so `contexts_SOME` is load-bearing
    # and fail-closed: an org not reachable through any visible context is
    # filtered out entirely. Mirrors the PersonPulse context-reach branch.
    filter: [
      {
        where: {
          node: {
            contexts_SOME: {
              OR: [
                { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  meSpace_SOME: {
                    members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                  }
                }
                { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  weSpace_SOME: {
                    members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                  }
                }
              ]
            }
          }
        }
      }
    ]
    # WRITE — CREATE/UPDATE/DELETE require OWNER, ADMIN, or MEMBER on the owning
    # Me/We space (GUESTs excluded, kb/02). Redundant while `@mutation` disables
    # generated writes, but kept so any future authoring path fails closed.
    validate: [
      {
        operations: [CREATE, UPDATE, DELETE]
        where: {
          node: {
            contexts_SOME: {
              OR: [
                { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  weSpace_SOME: {
                    members_SOME: {
                      AND: [
                        { member_SOME: { id_EQ: "$jwt.user.id" } }
                        { role_IN: [ADMIN, MEMBER] }
                      ]
                    }
                  }
                }
              ]
            }
          }
        }
      }
    ]
  ) {
  id: ID! @id
  name: String!
  description: String
  createdAt: DateTime
  updatedAt: DateTime
  # Contexts this org is attached to (HAS_ORGANIZATION). Open nested CONNECT is
  # disabled — the attach path is the server-side ingest write only; leaving it
  # would let any context editor rehome an org by id.
  contexts: [FieldContext!]!
    @relationship(
      type: "HAS_ORGANIZATION"
      direction: IN
      nestedOperations: [DISCONNECT]
    )
  # Pulses this org was identified as related to / named in (MENTIONED_IN).
  mentionedIn: [FieldPulse!]!
    @relationship(
      type: "MENTIONED_IN"
      direction: OUT
      nestedOperations: [DISCONNECT]
    )
  extractedFrom: [Document!]!
    @relationship(type: "EXTRACTED_FROM", direction: OUT)
}

# ============================================================================
# ACTIVITY LOG
# ============================================================================

"""
Activity log for tracking changes and updates.
Preserved from reference schema for audit trail.

MIGRATION: Log entries reference pulses that now live in FieldContexts.
Logs maintain direct relationships to pulses for historical tracking,
but pulse discovery should go through Space → FieldContext → Pulse path.
"""
type Log
  @node(labels: ["Log"])
  # Writes are server-side ONLY. Every real Log is written by raw Cypher
  # (`createLog` in lib/activity-logs, or inline in a mutation's own statement)
  # or by the `log*Activity` resolvers, which gate on `canEditContext`. NOTHING
  # in the app used the generated `createLogs` / `updateLogs` / `deleteLogs`
  # roots — and while they were open, ANY authenticated caller could forge an
  # activity entry, rewrite someone else's, or delete one. An activity feed that
  # can be rewritten by its subject is not an audit trail. (GOAL-342 review.)
  @mutation(operations: [])
  @authorization(
    # READ — a Log is as visible as what it is ABOUT. Without this filter the
    # generated `logs` root was a platform-wide read oracle: descriptions are
    # assembled server-side from graph reads, so they carry pulse titles,
    # people's names and field titles verbatim out of Spaces the caller cannot
    # reach. `logs(where: { description_CONTAINS: "..." })` enumerated them.
    #
    # Two ways in, because neither alone is right:
    # - `createdBy` — you can always see your own activity, including Logs that
    #   are LOGGED_FOR nothing (membership and Space-level events).
    # - `pulses_SOME` — anyone who can reach the Space of a pulse the Log is
    #   about can see it, which is what makes it a shared activity feed rather
    #   than a private one. Mirrors the PromiseWeave/ResonanceLink reach test.
    #
    # Fails closed: a Log about nothing, by someone else, is invisible here.
    filter: [
      { where: { node: { createdBy_SOME: { id_EQ: "$jwt.user.id" } } } }
      {
        where: {
          node: {
            pulses_SOME: {
              context_SOME: {
                OR: [
                  { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                  {
                    meSpace_SOME: {
                      members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                    }
                  }
                  { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                  {
                    weSpace_SOME: {
                      members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                    }
                  }
                ]
              }
            }
          }
        }
      }
    ]
  ) {
  id: ID! @id
  description: String!
  createdAt: DateTime!
    @timestamp(operations: [CREATE])
    @settable(onCreate: true, onUpdate: false)
  metadata: String
  createdBy: [Person!]! @relationship(type: "CREATED_BY", direction: OUT)
  
  # Direct references to pulses (for audit trail)
  # NOTE: These pulses exist in FieldContexts within Spaces
  goals: [GoalPulse!]! @relationship(type: "LOGGED_FOR", direction: OUT)
  resources: [ResourcePulse!]! @relationship(type: "LOGGED_FOR", direction: OUT)
  pulses: [FieldPulse!]! @relationship(type: "LOGGED_FOR", direction: OUT)
}

# ============================================================================
# NOTIFICATION (recipient-addressed, per-person read state)
# ============================================================================

"""
The kind of event that produced a Notification. MENTION is plumbed but has no
production emitter until a mention-authoring surface exists.
"""
enum NotificationType {
  INVITE
  ROLE_CHANGE
  MEMBERSHIP
  RESONANCE
  MENTION
}

"""
A recipient-addressed notification with server-side read state.

Distinct from Log: a Log is the immutable, space-wide audit trail of everything
that happened; a Notification is owned by exactly one recipient, concerns them
specifically, and is individually read/unread. Notifications back the bell
popover; the audit Log backs the dedicated activity-log page.

Created ONLY by the trusted server-side createNotification service (never via a
client mutation), so the library-generated create/update/delete operations are
disabled here. Read access is restricted to the single recipient via the
@authorization filter below; the mark-read mutations re-check the JWT user id.
"""
type Notification
  @node(labels: ["Notification"])
  @mutation(operations: [])
  @authorization(
    # READ — a Notification is visible ONLY to its single recipient.
    filter: [
      { where: { node: { recipient_SOME: { id_EQ: "$jwt.user.id" } } } }
    ]
  ) {
  id: ID! @id
  type: NotificationType!
  title: String!
  message: String!
  link: String
  read: Boolean!
  readAt: DateTime
  createdAt: DateTime!
    @timestamp(operations: [CREATE])
    @settable(onCreate: true, onUpdate: false)
  metadata: String
  recipient: [Person!]! @relationship(type: "NOTIFIES", direction: OUT)
  actor: [Person!]! @relationship(type: "TRIGGERED_BY", direction: OUT)
}

# ============================================================================
# SEARCH LAYER (Cross-Entity Discovery)
# ============================================================================

"""
Directory-safe projection of a Person for global search results.
GOAL-275: searchAll's people rows come from a custom resolver returning plain
objects, so Person's field-level @authorization never runs for them. Typing
the field as Person let clients *select* PII fields (resolving to null only
because the resolver happened to omit them). This dedicated type makes the
restriction structural — only these four fields exist to select.
"""
type PersonSearchResult
  # Never a Neo4j node — only materialized by the searchAll resolver. Disable
  # every auto-generated root so no phantom :PersonSearchResult query/mutation
  # surface exists (mirrors the PersonInterface / LifeSensor lockdown).
  @query(read: false, aggregate: false)
  @mutation(operations: [])
  @subscription(events: []) {
  id: ID!
  firstName: String!
  lastName: String!
  photo: String
}

"""
Structured response for categorized search results.
Returns up to 10 results of each entity type matching the search query.
"""
type SearchResults
  # Never a Neo4j node — only materialized by the searchAll resolver. Same
  # lockdown as PersonSearchResult: without it the library generates
  # searchResults/createSearchResults/... roots that let any caller write
  # junk :SearchResults nodes.
  @query(read: false, aggregate: false)
  @mutation(operations: [])
  @subscription(events: []) {
  people: [PersonSearchResult!]!
  meSpaces: [MeSpace!]!
  weSpaces: [WeSpace!]!
  contexts: [FieldContext!]!
  goalPulses: [GoalPulse!]!
  resourcePulses: [ResourcePulse!]!
  storyPulses: [StoryPulse!]!
  carePulses: [CarePulse!]!
  coreValuePulses: [CoreValuePulse!]!
  # GOAL-343 — weaves match on `title` and are Space-scoped through their
  # HAS_WEAVE FieldContext, exactly as ResonanceLink would be. The resolver
  # restates that reach test in Cypher; the @authorization filter on
  # PromiseWeave does NOT apply to a custom resolver's raw query.
  promiseWeaves: [PromiseWeave!]!
}

